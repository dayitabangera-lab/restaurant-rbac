<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="topbar">
        <div>
            <h2>Welcome, {{ user_name }}</h2>
            <p>Role: <b>{{ role_name }}</b></p>
        </div>
        <a class="logout" href="{{ url_for('logout') }}">Logout</a>
    </div>

    <div class="card">
        <h1>Allowed Activities</h1>
        <div class="grid">
            {% for a in activities %}
                <a class="activity" href="{{ url_for('activity_page', activity_id=a['ActivityId']) }}">
                    <div class="activity-title">{{ a['ActivityName'] }}</div>
                    <div class="activity-desc">{{ a['AccessDetail'] }}</div>
                </a>
            {% endfor %}
        </div>
    </div>
</body>
</html>
