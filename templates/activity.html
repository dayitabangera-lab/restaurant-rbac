<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="card">
        {% if denied %}
            <h1>Access Denied</h1>
            <p>You do not have permission to access <b>{{ activity_name }}</b>.</p>
        {% else %}
            <h1>{{ activity_name }}</h1>
            <p>{{ access_detail }}</p>
        {% endif %}
        <a class="back" href="{{ url_for('dashboard') }}">Back to Dashboard</a>
    </div>
</body>
</html>
